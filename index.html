<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pure Authority — Combat Calculator</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap');

    :root{
      color-scheme: dark;
      --void: #0E0F14;
      --graphite: #161821;
      --panelA: rgba(27,29,39,.78);
      --panelB: rgba(14,15,20,.92);
      --purple: #5B2D8B;
      --purple2: #3A1E52;
      --gold: #F2C14E;
      --goldSoft: rgba(242,193,78,.18);
      --text: #ECEAF0;
      --muted: rgba(236,234,240,.72);
      --border: rgba(185,175,199,.18);
      --borderHover: rgba(185,175,199,.38);
      --radius: 13px;
      --shadow: 0 8px 40px rgba(0,0,0,.55);
    }

    *, *::before, *::after{ box-sizing: border-box; margin: 0; padding: 0; }

    body{
      background: var(--void);
      color: var(--text);
      font-family: -apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      min-height: 100vh;
    }

    .hero{
      position:relative;
      padding: 26px 14px 18px;
      border-bottom: 1px solid rgba(185,175,199,.18);
      background:
        linear-gradient(180deg, rgba(0,0,0,.20), rgba(0,0,0,.72)),
        radial-gradient(1200px 420px at 50% 0%, rgba(91,45,139,.18), transparent 60%),
        linear-gradient(180deg, rgba(58,30,82,.35), rgba(14,15,20,.92));
    }

    .heroInner{
      max-width: 920px;
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 12px;
    }

    .logoFrame{
      width: min(680px, 94vw);
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(185,175,199,.13);
      background:
        radial-gradient(800px 240px at 50% 75%, rgba(242,193,78,.16), transparent 65%),
        linear-gradient(180deg, rgba(58,30,82,.42), rgba(14,15,20,.88));
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 4px;
    }

    .brandName{
      font-family: 'Cinzel', serif;
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: .04em;
      background: linear-gradient(135deg, #F2C14E 0%, #E8A020 40%, #F2C14E 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brandTag{
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(236,234,240,.52);
    }

    .heroTitle{
      font-family: 'Cinzel', serif;
      font-size: clamp(13px, 2.8vw, 18px);
      font-weight: 600;
      letter-spacing: .08em;
      color: rgba(236,234,240,.80);
    }

    .wrap{
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 14px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HISCORES LOOKUP */
    .lookupPanel{
      background: var(--panelA);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lookupTitle{
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .lookupRow{
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lookupInput{
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text);
      background: rgba(8,10,14,.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color .18s;
    }

    .lookupInput::placeholder{ color: rgba(236,234,240,.35); }
    .lookupInput:focus{ border-color: var(--gold); }

    .lookupBtn{
      padding: 12px 20px;
      font-size: 14px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--void);
      background: linear-gradient(135deg, #F2C14E, #E8A020);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .15s, transform .1s;
    }

    .lookupBtn:hover{ opacity: .88; }
    .lookupBtn:active{ transform: scale(.97); }
    .lookupBtn:disabled{ opacity: .45; cursor: not-allowed; }

    .lookupStatus{
      font-size: 13px;
      min-height: 18px;
      color: var(--muted);
    }
    .lookupStatus.ok{ color: #7fdd9a; }
    .lookupStatus.err{ color: #f08080; }

    /* PANELS */
    .panel{
      background: var(--panelA);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 24px;
    }

    .panelTitle{
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .row{
      display:grid;
      grid-template-columns: 140px 1fr;
      align-items:center;
      gap: 12px;
      margin-bottom: 14px;
    }

    label{
      font-size: 15px;
      color: var(--muted);
      letter-spacing: .2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label img{
      width: 22px;
      height: 22px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    input{
      width:100%;
      padding: 16px 14px;
      font-size: 20px;
      color: var(--text);
      background: rgba(8,10,14,.55);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus{
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(91,45,139,.22);
    }

    .btnRow{
      display:flex;
      gap: 12px;
      margin-top: 6px;
      justify-content: flex-start;
    }

    .btn{
      min-width: 160px;
      padding: 15px 28px;
      font-size: 16px;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: .06em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover{ opacity: .88; }
    .btn:active{ transform: scale(.97); }

    .btnPrimary{
      background: linear-gradient(135deg, #7B3FBE, #4A1E7A);
      color: #fff;
      box-shadow: 0 4px 18px rgba(91,45,139,.38);
    }

    /* RESULT */
    #result{
      display:none;
      background: var(--panelB);
      border: 1px solid rgba(242,193,78,.22);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
    }

    .resultGrid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .resultCard{
      background: rgba(27,29,39,.65);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display:flex;
      flex-direction: column;
      gap: 4px;
    }

    .resultLabel{
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(236,234,240,.48);
    }

    .resultValue{
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.1;
    }

    .resultSub{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    .needList{
      margin: 10px 0 0 0;
      padding: 0;
      list-style: none;
      display:flex;
      flex-direction:column;
      gap: 4px;
    }

    .needList li{
      font-size: 14px;
      color: var(--muted);
    }

    #errorMsg{
      color: #f08080;
      font-size: 15px;
      margin-bottom: 10px;
      display:none;
    }

    .hint{
      margin-top: 14px;
      opacity: .72;
      font-size: 13px;
      line-height: 1.35;
      color: rgba(236,234,240,.72);
      font-family: -apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }

    @media (max-width: 560px){
      .row{ grid-template-columns: 120px 1fr; }
      label{ font-size: 14px; }
      input{ font-size: 18px; padding: 14px 12px; }
      .btn{ min-width: 0; width: 100%; }
      .btnRow{ justify-content: stretch; }
      .lookupRow{ flex-direction: column; }
      .lookupBtn{ width: 100%; }
    }
  </style>

</head>

  <script>

    async function lookupPlayer() {
      const nameEl = document.getElementById('playerName');
      const btn    = document.getElementById('lookupBtn');
      const status = document.getElementById('lookupStatus');

      const name = nameEl.value.trim();
      if (!name) {
        status.textContent = 'Please enter a username.';
        status.className = 'lookupStatus err';
        return;
      }

      btn.disabled = true;
      status.className = 'lookupStatus';
      status.textContent = 'Looking up ' + name + '...';

      try {
        const encoded = encodeURIComponent(name);
        const res = await fetch(
          'https://api.wiseoldman.net/v2/players/' + encoded,
          { headers: { 'User-Agent': 'PureAuthority-CombatCalc/1.0' } }
        );

        if (!res.ok) {
          if (res.status === 404) {
            status.textContent = 'Player "' + name + '" not found on hiscores.';
          } else {
            status.textContent = 'API error (' + res.status + '). Try again.';
          }
          status.className = 'lookupStatus err';
          btn.disabled = false;
          return;
        }

        const data = await res.json();
        const skills = data?.latestSnapshot?.data?.skills;

        if (!skills) {
          status.textContent = 'Could not read stats. Player may need to be tracked on WOM first.';
          status.className = 'lookupStatus err';
          btn.disabled = false;
          return;
        }

        const get = (skill) => {
          const lvl = skills[skill]?.level;
          return (lvl && lvl > 0) ? lvl : 1;
        };

        document.getElementById('atk').value  = get('attack');
        document.getElementById('str').value  = get('strength');
        document.getElementById('def').value  = get('defence');
        document.getElementById('hp').value   = Math.max(10, get('hitpoints'));
        document.getElementById('rng').value  = get('ranged');
        document.getElementById('mag').value  = get('magic');
        document.getElementById('pray').value = get('prayer');

        status.textContent = '✓ Stats loaded for ' + (data.displayName || name);
        status.className = 'lookupStatus ok';

        calculate();

      } catch (err) {
        status.textContent = 'Network error. Check connection and try again.';
        status.className = 'lookupStatus err';
      }

      btn.disabled = false;
    }

    document.getElementById('playerName').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') lookupPlayer();
    });

    function validate(s){
      const keys = ["atk","str","def","hp","rng","mag","pray"];
      for(const k of keys){
        if(!Number.isFinite(s[k])) return k.toUpperCase() + " must be a whole number.";
        if(s[k] < 1 || s[k] > 99) return k.toUpperCase() + " must be between 1 and 99.";
      }
      if(s.hp < 10) return "HP must be at least 10.";
      return null;
    }

    function combatFrom(s){
      const base  = 0.25 * (s.def + s.hp + Math.floor(s.pray / 2));
      const melee = 0.325 * (s.atk + s.str);
      const ranged= 0.325 * (s.rng + Math.floor(s.rng / 2));
      const magic = 0.325 * (s.mag + Math.floor(s.mag / 2));
      const top   = Math.max(melee, ranged, magic);
      let type = "Warrior";
      if(top === ranged) type = "Ranger";
      if(top === magic)  type = "Mage";
      return { combat: Math.floor(base + top), type };
    }

    function minIncreaseToReachTargetFloor(baseStats, key, targetFloor){
      let s = {...baseStats};
      for(let i = 1; i <= 99 - baseStats[key]; i++){
        s[key] = baseStats[key] + i;
        if(Math.floor(combatFrom(s).combat) >= targetFloor) return i;
      }
      return null;
    }

    function calculate(){
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      const s = {};
      for(const k of ["atk","str","def","hp","rng","mag","pray"]){
        s[k] = parseInt(document.getElementById(k).value, 10);
      }

      const err = validate(s);
      if(err){
        errEl.textContent = err;
        errEl.style.display = 'block';
        document.getElementById('result').style.display = 'none';
        return;
      }

      const { combat, type } = combatFrom(s);
      const next = combat + 1;

      document.getElementById('rCombat').textContent = combat;
      document.getElementById('rType').textContent   = type + ' build';

      const list = document.getElementById("needList");
      list.innerHTML = "";

      const addLine = (list, label, val) => {
        if (val === null) return;
        const li = document.createElement('li');
        li.textContent = label + ': +' + val;
        list.appendChild(li);
      };

      addLine(list, "Attack or Strength", minIncreaseToReachTargetFloor(s, "atk", next) !== null
        ? Math.min(
            minIncreaseToReachTargetFloor(s, "atk", next) ?? 99,
            minIncreaseToReachTargetFloor(s, "str", next) ?? 99
          )
        : null);
      addLine(list, "Hitpoints or Defence", minIncreaseToReachTargetFloor(s, "hp", next) !== null
        ? Math.min(
            minIncreaseToReachTargetFloor(s, "hp", next) ?? 99,
            minIncreaseToReachTargetFloor(s, "def", next) ?? 99
          )
        : null);
      addLine(list, "Ranged", minIncreaseToReachTargetFloor(s, "rng", next));
      addLine(list, "Magic",  minIncreaseToReachTargetFloor(s, "mag", next));
      addLine(list, "Prayer", minIncreaseToReachTargetFloor(s, "pray", next));

      document.getElementById("result").style.display = "block";
    }

    document.getElementById("calcBtn").addEventListener("click", calculate);
    calculate();

  </script>
